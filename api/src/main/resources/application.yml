spring:
  application:
    name: lavadero-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

server:
  port: 8080

lavadero:
  auth:
    enabled: true
    jwt-secret: ${LAVADERO_JWT_SECRET:dev-only-change-this-secret-32-bytes-minimum}
    access-token-minutes: 480
    refresh-token-days: 14
    bootstrap-owner:
      enabled: true
      username: ${LAVADERO_BOOTSTRAP_USERNAME:dueno}
      password: ${LAVADERO_BOOTSTRAP_PASSWORD:cambia-esto-123}
      full-name: ${LAVADERO_BOOTSTRAP_FULL_NAME:Dueno Lavadero}
    bootstrap-admin:
      enabled: ${LAVADERO_ADMIN_ENABLED:true}
      username: ${LAVADERO_ADMIN_USERNAME:brandon}
      password: ${LAVADERO_ADMIN_PASSWORD:cambia-esto-123}
      full-name: ${LAVADERO_ADMIN_FULL_NAME:Brandon Rubio}
  ai:
    enabled: ${LAVADERO_AI_ENABLED:true}
    provider: ${LAVADERO_AI_PROVIDER:deterministic-local}
    api-key: ${LAVADERO_AI_API_KEY:}
    model: ${LAVADERO_AI_MODEL:local}
    base-url: ${LAVADERO_AI_BASE_URL:}
    timeout-seconds: ${LAVADERO_AI_TIMEOUT_SECONDS:20}
    scheduler:
      enabled: ${LAVADERO_AI_SCHEDULER_ENABLED:false}
  forecast:
    provider: ${LAVADERO_FORECAST_PROVIDER:java}
    python-base-url: ${LAVADERO_FORECAST_PYTHON_URL:http://lavadero-forecast:8081}
    python-timeout-seconds: ${LAVADERO_FORECAST_PYTHON_TIMEOUT:30}
  weather:
    enabled: ${LAVADERO_WEATHER_ENABLED:false}
    lat: ${LAVADERO_WEATHER_LAT:26.05}
    lon: ${LAVADERO_WEATHER_LON:-98.28}
    archive-base-url: ${LAVADERO_WEATHER_ARCHIVE_URL:https://archive-api.open-meteo.com/v1/archive}
    forecast-base-url: ${LAVADERO_WEATHER_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
    timeout-seconds: ${LAVADERO_WEATHER_TIMEOUT:10}
    forecast-days: ${LAVADERO_WEATHER_FORECAST_DAYS:14}
