# Production compose: one self-contained copy of the app (postgres + api + web)
# per business. Secrets come from .env next to this file. Never commit a real .env.
#
# HTTPS is NOT here: a single shared Caddy (docker-compose.edge.yml) owns ports
# 80/443 and routes each business's domain to its <instance>-web container over
# the external "lavadero-edge" network. See docs/DEPLOY.md.

name: ${LAVADERO_INSTANCE:-lavadero}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${LAVADERO_INSTANCE:-lavadero}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lavadero}
      POSTGRES_USER: ${POSTGRES_USER:-lavadero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/brubiol/lavadero-platform/api:latest
    container_name: ${LAVADERO_INSTANCE:-lavadero}-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lavadero}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-lavadero}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Caps the heap so three business instances fit comfortably on one free VM.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      LAVADERO_JWT_SECRET: ${LAVADERO_JWT_SECRET}
      LAVADERO_BOOTSTRAP_USERNAME: ${LAVADERO_BOOTSTRAP_USERNAME}
      LAVADERO_BOOTSTRAP_PASSWORD: ${LAVADERO_BOOTSTRAP_PASSWORD}
      LAVADERO_BOOTSTRAP_FULL_NAME: ${LAVADERO_BOOTSTRAP_FULL_NAME}
      LAVADERO_ADMIN_USERNAME: ${LAVADERO_ADMIN_USERNAME}
      LAVADERO_ADMIN_PASSWORD: ${LAVADERO_ADMIN_PASSWORD}
      LAVADERO_ADMIN_FULL_NAME: ${LAVADERO_ADMIN_FULL_NAME}
      # AI config is pinned here (not in .env) so the model never drifts back
      # to the deterministic-local fallback or a mini variant on redeploy.
      # Only LAVADERO_AI_API_KEY is a secret and comes from .env.
      LAVADERO_AI_ENABLED: "true"
      LAVADERO_AI_PROVIDER: openai-compatible
      LAVADERO_AI_BASE_URL: https://api.openai.com/v1
      LAVADERO_AI_MODEL: gpt-5.4
      LAVADERO_AI_TIMEOUT_SECONDS: "20"
      LAVADERO_AI_API_KEY: ${LAVADERO_AI_API_KEY}
    env_file:
      - .env
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  web:
    image: ghcr.io/brubiol/lavadero-platform/web:latest
    container_name: ${LAVADERO_INSTANCE:-lavadero}-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - edge

volumes:
  pgdata:

networks:
  edge:
    name: lavadero-edge
    external: true
