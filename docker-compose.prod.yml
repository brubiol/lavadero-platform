# Production compose — no local Postgres, points at RDS.
# Secrets come from /opt/lavadero/.env on the EC2 host.
# Never commit a .env file with real values.

services:
  api:
    image: ghcr.io/brubiol/lavadero-platform/api:latest
    container_name: lavadero-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://${RDS_HOST}:5432/${RDS_DB}
      SPRING_DATASOURCE_USERNAME: ${RDS_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${RDS_PASSWORD}
      LAVADERO_JWT_SECRET: ${LAVADERO_JWT_SECRET}
      LAVADERO_BOOTSTRAP_USERNAME: ${LAVADERO_BOOTSTRAP_USERNAME}
      LAVADERO_BOOTSTRAP_PASSWORD: ${LAVADERO_BOOTSTRAP_PASSWORD}
      LAVADERO_BOOTSTRAP_FULL_NAME: ${LAVADERO_BOOTSTRAP_FULL_NAME}
      LAVADERO_ADMIN_USERNAME: ${LAVADERO_ADMIN_USERNAME}
      LAVADERO_ADMIN_PASSWORD: ${LAVADERO_ADMIN_PASSWORD}
      LAVADERO_ADMIN_FULL_NAME: ${LAVADERO_ADMIN_FULL_NAME}
      # AI config is pinned here (not in .env) so the model never drifts back
      # to the deterministic-local fallback or a mini variant on redeploy.
      # Only LAVADERO_AI_API_KEY is a secret and comes from .env.
      LAVADERO_AI_ENABLED: "true"
      LAVADERO_AI_PROVIDER: openai-compatible
      LAVADERO_AI_BASE_URL: https://api.openai.com/v1
      LAVADERO_AI_MODEL: gpt-5.4
      LAVADERO_AI_TIMEOUT_SECONDS: "20"
      LAVADERO_AI_API_KEY: ${LAVADERO_AI_API_KEY}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  web:
    image: ghcr.io/brubiol/lavadero-platform/web:latest
    container_name: lavadero-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  # HTTPS for turbolavado.org with an automatic Let's Encrypt certificate.
  # Plain HTTP on port 80 stays available via the web container as a fallback.
  caddy:
    image: caddy:2
    container_name: lavadero-caddy
    restart: unless-stopped
    entrypoint: ["caddy"]
    command: ["reverse-proxy", "--from", "turbolavado.org", "--to", "web:80"]
    ports:
      - "443:443"
    depends_on:
      - web
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
