services:
  postgres:
    image: postgres:16
    container_name: lavadero-postgres
    environment:
      POSTGRES_USER: lavadero
      POSTGRES_PASSWORD: lavadero
      POSTGRES_DB: lavadero
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavadero -d lavadero"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: lavadero-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      LAVADERO_JWT_SECRET: ${LAVADERO_JWT_SECRET:-dev-only-change-this-secret-32-bytes-minimum}
      LAVADERO_BOOTSTRAP_USERNAME: ${LAVADERO_BOOTSTRAP_USERNAME:-dueno}
      LAVADERO_BOOTSTRAP_PASSWORD: ${LAVADERO_BOOTSTRAP_PASSWORD:-cambia-esto-123}
      LAVADERO_AI_ENABLED: ${LAVADERO_AI_ENABLED:-true}
      LAVADERO_AI_PROVIDER: ${LAVADERO_AI_PROVIDER:-deterministic-local}
      LAVADERO_AI_BASE_URL: ${LAVADERO_AI_BASE_URL:-}
      LAVADERO_AI_API_KEY: ${LAVADERO_AI_API_KEY:-}
      LAVADERO_AI_MODEL: ${LAVADERO_AI_MODEL:-local}
      LAVADERO_AI_TIMEOUT_SECONDS: ${LAVADERO_AI_TIMEOUT_SECONDS:-20}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    container_name: lavadero-web
    ports:
      - "5173:80"
    depends_on:
      - api

  # Optional Python forecast sidecar. The API does NOT depends_on this service
  # because the Java path is the default and the Python path falls back to Java
  # on any client error. Bring it up explicitly with `docker compose up forecast`
  # and set LAVADERO_FORECAST_PROVIDER=python on the api to route to it.
  forecast:
    build:
      context: ./forecast-python
    container_name: lavadero-forecast
    expose:
      - "8081"

volumes:
  postgres_data:
