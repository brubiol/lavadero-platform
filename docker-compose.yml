services:
  postgres:
    image: postgres:16
    container_name: lavadero-postgres
    environment:
      POSTGRES_USER: lavadero
      POSTGRES_PASSWORD: lavadero
      POSTGRES_DB: lavadero
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavadero -d lavadero"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
